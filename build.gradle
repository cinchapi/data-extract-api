buildscript {
  repositories {
    mavenCentral()
    maven {
      url "https://plugins.gradle.org/m2/"
    }
  }
  dependencies {
    // Spotless needs Java 17 to run, and this build also runs on Java 8
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
      classpath 'com.diffplug.spotless:spotless-plugin-gradle:8.2.1'
    }
  }
}

plugins {
  id 'java-library'
  id 'eclipse'
  id 'maven-publish'
}

wrapper {
  gradleVersion = '8.14.3'
}

// The project version is controlled externally by the "version.sh" script.
def getVersion = { ->
  def stdout = new ByteArrayOutputStream()
  exec {
    commandLine 'bash', 'version.sh'
    standardOutput = stdout
  }
  return stdout.toString().trim()
}

// The version that a build version publishes as, also from the "version.sh"
// script, which drops only the build number and keeps the branch's name whole.
def getPublishedVersion = { buildVersion ->
  def stdout = new ByteArrayOutputStream()
  exec {
    commandLine 'bash', 'version.sh', '--published', buildVersion
    standardOutput = stdout
  }
  return stdout.toString().trim()
}

group = 'com.cinchapi'
version = getVersion()
ext.mavenVersion = getPublishedVersion(version)

repositories {
  mavenCentral()
  maven {
    url 'https://oss.sonatype.org/content/repositories/snapshots/'
  }
  maven {
    url "https://dl.cloudsmith.io/public/cinchapi/open-source/maven/"
  }
  maven {
    url "https://dl.cloudsmith.io/public/cinchapi/open-source-snapshots/maven/"
  }
  maven {
    url "https://dl.cloudsmith.io/public/cinchapi/platform/maven/"
  }
  maven {
    url "https://dl.cloudsmith.io/public/cinchapi/platform-snapshots/maven/"
  }
  maven {
    url "https://dl.cloudsmith.io/public/cinchapi/3rdparty/maven/"
  }
  maven {
    url "https://dl.cloudsmith.io/public/cinchapi/enterprise/maven/"
    credentials {
      username = System.getenv('CLOUDSMITH_API_USER')
      password = System.getenv('CLOUDSMITH_API_KEY')
    }
  }
  maven {
    url "https://dl.cloudsmith.io/public/cinchapi/enterprise-snapshots/maven/"
    credentials {
      username = System.getenv('CLOUDSMITH_API_USER')
      password = System.getenv('CLOUDSMITH_API_KEY')
    }
  }
}

jar {
  manifest {
    attributes("Specificiation-Title": project.name, "Specificiation-Version": version, "Implementation-Version": version)
  }
}

if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}

// Target Java 8, even when a newer JDK runs the build
if (JavaVersion.current().isJava9Compatible()) {
  tasks.withType(JavaCompile).configureEach {
    options.release = 8
  }
}

task javadocJar(type: Jar, dependsOn: javadoc) {
  archiveClassifier = 'javadoc'
  from javadoc.destinationDir
}

task sourcesJar(type: Jar, dependsOn: classes) {
  archiveClassifier = 'sources'
  from sourceSets.main.allSource
}

task testJar(type: Jar, dependsOn: classes) {
  archiveClassifier = 'tests'
  from sourceSets.test.output
}

artifacts {
  archives sourcesJar
  archives testJar
  archives javadocJar
}

// Ensure that these transitive dependencies are excluded so we don't get version clashes
def exclusions = [[group : 'com.google.guava', module: 'guava']]
exclusions.each { exclusion ->
    configurations.implementation.dependencies.all {
        if (name != exclusion.module || group != exclusion.group) {
            exclude group: exclusion.group, module: exclusion.module
        }
    }
}

dependencies {
  api platform('com.cinchapi:cinchapi-bom:1.0.0')
  implementation 'com.google.guava:guava'
  implementation group: 'com.cinchapi', name: 'accent4j'
  implementation 'org.apache.commons:commons-csv:1.6'

  testImplementation 'junit:junit'
}

publishing {
  repositories {
    maven {
      name = 'cloudsmith'
      def releasesRepoUrl = "https://api-g.cloudsmith.io/maven/cinchapi/platform/"
      def snapshotsRepoUrl = "https://api-g.cloudsmith.io/maven/cinchapi/platform-snapshots/"
      // Only a master build publishes a plain X.Y.Z, so every other version,
      // such as a release candidate or a feature build, is a snapshot.
      url = (mavenVersion ==~ /\d+\.\d+\.\d+/) ? releasesRepoUrl : snapshotsRepoUrl
      credentials {
        username = System.getenv('CLOUDSMITH_API_USER')
        password = System.getenv('CLOUDSMITH_API_KEY')
      }
    }
  }
  publications {
    maven(MavenPublication) {
      from components.java
      artifact sourcesJar
      artifact javadocJar
      groupId group
      artifactId project.name
      version mavenVersion
    }
  }
}

// Format with the Cinchapi formatter when the build runs on Java 17 or later.
// The repo's own copyright headers stay as they are, so there is no license
// header step, and the Eclipse profile leaves header comments alone.
if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_17)) {
  apply plugin: 'com.diffplug.spotless'
  spotless {
    java {
      target 'src/*/java/**/*.java'
      importOrderFile 'spotless.java.importerorder'
      eclipse().configFile 'spotless.java.eclipseformat.xml'
    }
  }
}
